name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs tags/history for the version
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: >-
          pytest
          --cov=sro_config
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm
      - name: Build image
        run: docker build -f docker/Dockerfile -t sro-config:ci .
      - name: Smoke test
        run: |
          docker run --rm sro-config:ci --help
          docker run --rm --entrypoint python sro-config:ci -c "import sro_config; print(sro_config.__version__)"
      - name: Run the bundled example in the container
        run: |
          mkdir -p run
          cp examples/FeNi/FeNi.cif examples/FeNi/FeNi_solid_solution.rmc6f run/
          chmod 777 run
          docker run --rm -v "$PWD/run:/data" sro-config:ci dict --cif FeNi.cif --equivalence 0,1
          docker run --rm -v "$PWD/run:/data" sro-config:ci config --dict-dir . --sublattice 0 --rmc6f FeNi_solid_solution.rmc6f
          test -f run/FeNi_solid_solution_sub0_EF.clapp
